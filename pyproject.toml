[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "activation-fft"
version = "0.1.0"
description = "Token-axis Fourier analysis of language-model hidden activations"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yicheng Li" }]
requires-python = ">=3.9,<3.14"
keywords = ["interpretability", "fourier", "transformers", "activations", "spectral-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
    "torch>=2.0",
    "transformers>=4.40",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
# What examples/ needs on top of the package itself.
examples = ["matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/YichengLi318/Fourier_Interpreter"
Issues = "https://github.com/YichengLi318/Fourier_Interpreter/issues"

[project.scripts]
activation-fft = "activation_fft.cli:main"

[tool.setuptools]
packages = ["activation_fft"]
